[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-shot"
version = "0.1.0.dev0"
description = "Envío local supervisado de imágenes a Claude Code en iTerm2"
requires-python = ">=3.11"
dependencies = ["iterm2==2.30"]

[project.scripts]
claude-shot = "claude_shot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
